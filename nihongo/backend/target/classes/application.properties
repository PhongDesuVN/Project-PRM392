# ===================================
# Server
# ===================================
server.port=8080

# ===================================
# MySQL
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/PRM?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate
# ===================================
# none: schema do ban tu quan ly, Hibernate khong sua database
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# Jackson
# ===================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===================================
# JWT
# ===================================
jwt.secret=PRM392NihongoLearningAppSecretKeyForJWTTokenGeneration2024MustBeAtLeast256Bits
jwt.expiration=86400000

# ===================================
# Quen mat khau
# ===================================
app.password-reset.expiration-minutes=30
# true: tra token trong response de test khi chua co email service. Tat truoc khi deploy.
app.password-reset.expose-token=true

# ===================================
# Logging
# ===================================
logging.level.com.prm.backend=DEBUG

